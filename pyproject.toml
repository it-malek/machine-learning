[project]
name = "machine-learning-coursework"
version = "0.1.0"
description = "Machine-learning coursework and the heart-failure example"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = ["nbformat>=5.11.1,<6"]
visualization = [
    "lifelines>=0.30.3,<0.31",
    "matplotlib>=3.11.2,<3.12",
    "nbformat>=5.11.1,<6",
    "pandas>=2.1,<3",
    "seaborn>=0.13.2,<0.14",
]
classifiers = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<0.14",
    "scikit-learn>=1.3,<2",
    "xgboost>=2.0,<4",
    "shap>=0.43,<1",
    # SHAP needs a Numba release compatible with the supported Python versions.
    "numba>=0.61,<1",
]
notebooks = [
    "jupyter>=1.0,<2",
    "ipykernel>=6.0,<8",
    "nbconvert>=7.0,<8",
    "nbformat>=5.11.1,<6",
]
images = [
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
    "scikit-image>=0.21,<1",
    "scikit-learn>=1.3,<2",
]

[tool.uv]
package = false
required-version = ">=0.11.21"


[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
